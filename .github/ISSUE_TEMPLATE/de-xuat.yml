name: Đề xuất tính năng
description: Chức năng mới hoặc cải tiến cho backend, app Admin, app Client
title: "[Đề xuất] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Đối chiếu [Product](https://github.com/TruongSoCute/Gugugaga-AndroidProject/blob/main/docs/development/Product.md) trước: chức năng **bắt buộc** của đề luôn ưu tiên hơn phần mở rộng.
  - type: dropdown
    id: phan
    attributes:
      label: Phần liên quan
      multiple: true
      options:
        - Backend (API)
        - App Admin (Android)
        - App Client (Flutter)
        - Tài liệu
    validations:
      required: true
  - type: dropdown
    id: loai
    attributes:
      label: Loại
      options:
        - Chức năng bắt buộc của đề còn thiếu
        - Cải tiến chức năng đã có
        - Phần mở rộng (chỉ làm sau phần bắt buộc)
    validations:
      required: true
  - type: textarea
    id: van-de
    attributes:
      label: Vấn đề hoặc nhu cầu
      description: Ai cần, trong tình huống nào, hiện tại gặp khó khăn gì.
    validations:
      required: true
  - type: textarea
    id: giai-phap
    attributes:
      label: Giải pháp đề xuất
      description: Màn hình, API, thay đổi dữ liệu dự kiến. Điểm nào đề chưa quy định thì ghi "Đề xuất, cần xác nhận".
  - type: textarea
    id: thay-the
    attributes:
      label: Phương án khác đã cân nhắc
