org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Địa chỉ backend (phải có dấu / ở cuối — Phụ lục 2).
# Bản debug chạy với backend trên máy: máy ảo Android gọi máy tính qua 10.0.2.2.
# Điện thoại thật cùng Wi-Fi: thay bằng http://<IP-máy-tính>:3000/
ocopApiBaseUrlDebug=http://10.0.2.2:3000/
# Bản release: địa chỉ Render sau khi deploy (luôn https).
ocopApiBaseUrlRelease=https://ocop-backend.onrender.com/
